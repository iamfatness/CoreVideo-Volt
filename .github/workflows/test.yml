name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'Linux'
      - name: Contract tests
        working-directory: control
        run: python -m unittest discover -s tests -v
      - name: Install smoke test (pip install, console script)
        run: |
          python -m pip install ./control
          volt version

  # The same suite again with VOLT_TEST_PG_DSN set, so the live Postgres tests (races, pool, migrations)
  # run and the ordinary tests are exercised against SQLite as before. Linux only: GitHub's Windows
  # runners cannot host service containers. psycopg and psycopg_pool are installed here and nowhere else,
  # so the contract jobs above keep proving the stdlib-only SQLite path.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VOLT_TEST_PG_DSN: postgresql://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the Postgres drivers
        run: python -m pip install "psycopg[binary]==3.3.6" "psycopg_pool==3.3.3"
      - name: Install the Postgres client tools (the backup tests run pg_dump and pg_restore)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Contract tests on Postgres
        working-directory: control
        run: python -m unittest discover -s tests -v

  # Windows has no service containers, but the windows-latest image ships PostgreSQL (stopped). Start that
  # service and run the same suite against it, so the Windows-specific paths (file locking, pg_dump.exe,
  # temp directories) are exercised with Postgres as well as SQLite.
  postgres-windows:
    runs-on: windows-latest
    env:
      VOLT_TEST_PG_DSN: postgresql://postgres:root@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Start the preinstalled PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -InputObject $svc -StartupType Automatic
          Start-Service -InputObject $svc
          "$env:PGBIN" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:PGBIN\pg_isready.exe" -h localhost -p 5432
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\psql.exe" -h localhost -U postgres -Atc 'select version()'
      - name: Install the Postgres drivers
        run: python -m pip install "psycopg[binary]==3.3.6" "psycopg_pool==3.3.3"
      - name: Contract tests on Postgres (Windows)
        working-directory: control
        run: python -m unittest discover -s tests -v
