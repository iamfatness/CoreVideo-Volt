name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Contract tests
        working-directory: control
        run: python -m unittest discover -s tests -v
