# Prometheus scrape example for Volt. UNVALIDATED: never loaded into a Prometheus.
#
# /metrics is behind the same sign-in as every data route, so give Prometheus a token of an admin or operator user created for it
# (volt user add prometheus operator). Keep the token in a file, never in this file or in a URL.
# With several serve nodes, list every node as a target: the in-process series are per node and Prometheus sums them.

scrape_configs:
  - job_name: volt
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/volt-token
    static_configs:
      - targets: ["volt-1.example.com", "volt-2.example.com"]

rule_files:
  - volt-alerts.yml
